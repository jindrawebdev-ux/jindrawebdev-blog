---
deployment:
  tasks:
    - export DEPLOYPATH=/home/lexiizgf/jindrawebdev.com/
    - /bin/cp -R blog.php $DEPLOYPATH
    - /bin/cp -R article.php $DEPLOYPATH
    - /bin/cp -R about.php $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/services
    - /bin/cp -R services/index.php $DEPLOYPATH/services/index.php
    - /bin/cp -R blog-data $DEPLOYPATH
    - /bin/cp -R sitemap.xml $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/css
    - /bin/cp -R css/tailwind.min.css $DEPLOYPATH/css/tailwind.min.css
    - /bin/mkdir -p $DEPLOYPATH/images/blog
    - /bin/cp -R images/blog/. $DEPLOYPATH/images/blog/
    - /bin/mkdir -p $DEPLOYPATH/includes
    - /bin/cp -R includes/header.php $DEPLOYPATH/includes/header.php
    - /bin/cp -R includes/footer.php $DEPLOYPATH/includes/footer.php
